<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario de Tertulias 2025</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --color-primario: #2c3e50;
      --color-secundario: #ecf0f1;
      --color-acento: #c0392b;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      color: var(--color-primario);
      background: var(--color-secundario);
    }
    h1, h2 {
      font-family: Georgia, serif;
      margin: 0 0 10px 0;
    }
    h1 {
      margin-bottom: 5px;
    }
    h2 {
      margin-top: 24px;
      border-bottom: 2px solid var(--color-acento);
      padding-bottom: 6px;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 8px 0; }
    a { color: var(--color-acento); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .month { background: #fff; padding: 16px; border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin-top: 14px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #d9d9d9; padding: 10px; text-align: center; vertical-align: middle; }
    th { background: #f4f6f8; font-weight: 600; }
    td.empty { background: #fafafa; }
    .tertulia { background: #fde7df; font-weight: bold; }
    .tertulia a { color: #000; text-decoration: none; display: block; }
  </style>
</head>
<body>

  <h1>Calendario de Tertulias 2025</h1>
  <p>Aquí se muestran todas las tertulias celebradas y programadas para el año en curso.</p>

  <!-- Listado cronológico -->
  <h2>Listado de tertulias 2025</h2>
  <ul id="listadoTertulias"></ul>

  <!-- Calendarios generados dinámicamente aquí -->
  <div id="calendarios"></div>

<script>
const GAS_URL_TERTULIAS = "https://script.google.com/macros/s/AKfycbzWPBO9hrwIb6gFFbs93JpJhuNSuhNOYheKPQtHlaj_RR5zUryQ2jKHfM-EcAGfFjCVvg/exec";
const NOMBRES_MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_SEMANA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

async function cargarTertulias() {
  try {
    const res = await fetch(GAS_URL_TERTULIAS + "?action=listar");
    const json = await res.json();

    // Filtrar solo tertulias futuras o de hoy
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const tertuliasFiltradas = json.filter(t => {
      const fechaT = new Date(t.fecha);
      fechaT.setHours(0,0,0,0);
      return fechaT.getTime() >= hoy.getTime();
    });

    // Actualizar listado
    const listado = document.getElementById("listadoTertulias");
    listado.innerHTML = "";
    tertuliasFiltradas.forEach(t => {
      const li = document.createElement("li");
      li.innerHTML = `${new Date(t.fecha).toLocaleDateString('es-ES', {weekday:'long', day:'2-digit', month:'short', year:'numeric'})} · <a href="${t.foto || '#'}" target="_blank">${t.tema}</a>`;
      listado.appendChild(li);
    });

    // Generar calendarios solo para meses vigentes
    let tertuliasPorMes = {};
    tertuliasFiltradas.forEach(t=>{
      const f = new Date(t.fecha); f.setHours(0,0,0,0);
      const y = f.getFullYear();
      const m = f.getMonth();
      const clave = `${y}-${m}`;
      if(!tertuliasPorMes[clave]) tertuliasPorMes[clave] = [];
      tertuliasPorMes[clave].push({...t, dia: f.getDate()});
    });

    const calendariosDiv = document.getElementById('calendarios');
    calendariosDiv.innerHTML = '';
    Object.keys(tertuliasPorMes).sort().forEach(mesClave=>{
      const [anio, mes] = mesClave.split('-').map(Number);
      const eventos = tertuliasPorMes[mesClave];
      let eventosPorDia = {};
      eventos.forEach(ev=>{eventosPorDia[ev.dia] = ev;});

      const f = new Date(anio, mes, 1);
      const primeroWeekDay = (f.getDay() + 6)%7;
      const diasDelMes = new Date(anio, mes+1, 0).getDate();
      let tablaHtml = `<div class="month"><h2>${NOMBRES_MESES[mes]} ${anio}</h2><table><tr>`;
      DIAS_SEMANA.forEach(d=>tablaHtml+=`<th>${d}</th>`); tablaHtml+=`</tr><tr>`;
      let diaSemana = 0;
      for(; diaSemana<primeroWeekDay; diaSemana++) tablaHtml += `<td class="empty"></td>`;
      for(let dia=1; dia<=diasDelMes; dia++) {
        let contenido = `${dia}`;
        let classTd = "";
        if(eventosPorDia[dia]) {
          classTd = "tertulia";
          contenido = `<a href="${eventosPorDia[dia].foto || '#'}" target="_blank">${dia}<br>${eventosPorDia[dia].tema}</a>`;
        }
        tablaHtml += `<td class="${classTd}">${contenido}</td>`;
        diaSemana++;
        if(diaSemana===7 && dia<diasDelMes){ tablaHtml+="</tr><tr>"; diaSemana=0; }
      }
      for(; diaSemana && diaSemana<7; diaSemana++) tablaHtml+=`<td class="empty"></td>`;
      tablaHtml += `</tr></table></div>`;
      calendariosDiv.innerHTML += tablaHtml;
    });

  } catch (error) {
    console.error(error);
  }
}
window.onload = cargarTertulias;
</script>
</body>
</html>
