<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Calendario de Tertulias 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <style>
    :root {
      --color-primario: #2c3e50;
      --color-secundario: #ecf0f1;
      --color-acento: #c0392b;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      color: var(--color-primario);
      background: var(--color-secundario);
      line-height: 1.5;
    }

    h1, h2 {
      font-family: Georgia, serif;
      margin: 0 0 10px 0;
    }

    h1 {
      margin-bottom: 5px;
      text-align: center;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
    }

    h2 {
      margin-top: 24px;
      border-bottom: 2px solid var(--color-acento);
      padding-bottom: 6px;
      font-size: clamp(1rem, 1.8vw, 1.4rem);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 8px 0;
      font-size: clamp(0.9rem, 1.5vw, 1rem);
    }

    a {
      color: var(--color-acento);
      text-decoration: none;
      word-break: break-word;
    }

    a:hover {
      text-decoration: underline;
    }

    .month {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      margin-top: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch; /* scroll suave en iOS/Android */
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      table-layout: fixed;
      min-width: 350px;
    }

    th, td {
      border: 1px solid #d9d9d9;
      padding: 8px 6px;
      text-align: center;
      vertical-align: middle;
      word-wrap: break-word;
      white-space: normal;
      font-size: 0.95em;
    }

    th {
      background: #f4f6f8;
      font-weight: 600;
    }

    td.empty {
      background: #fafafa;
    }

    .tertulia {
      background: #fde7df;
      font-weight: bold;
      border: 1px solid #e0b3a7;
    }

    .tertulia a {
      color: #000;
      text-decoration: none;
      display: block;
      font-size: 0.9em;
      line-height: 1.3;
      padding: 4px;
    }

    /* 💡 Media queries para móviles */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .month {
        padding: 12px;
        margin-top: 10px;
      }

      table {
        min-width: 320px;
      }

      th, td {
        padding: 6px 3px;
        font-size: 0.8em;
      }

      h1 {
        font-size: 1.3em;
      }

      h2 {
        font-size: 1.1em;
      }

      ul {
        font-size: 0.85em;
      }

      li {
        margin-bottom: 6px;
      }
    }

    /* 💡 Ajuste adicional para pantallas muy pequeñas */
    @media (max-width: 380px) {
      th, td {
        font-size: 0.75em;
        padding: 4px 2px;
      }

      .tertulia a {
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>

  <h1>Calendario de Tertulias 2025</h1>
  <p style="text-align:center;font-size:0.95em;margin-top:0;">
    Aquí se muestran todas las tertulias celebradas y programadas para el año en curso.
  </p>

  <!-- Listado cronológico -->
  <h2>Listado de tertulias 2025</h2>
  <ul id="listadoTertulias"></ul>

  <!-- Calendarios generados dinámicamente -->
  <div id="calendarios"></div>

  <script>
    const GAS_URL_TERTULIAS = "https://script.google.com/macros/s/AKfycby_mTcYuKvpuKZbjbjpDOuv5eFwXIEiER6LCs_GCXjhZJRdFa4eA9kMzG0IQaiBKxIzIw/exec";
    const NOMBRES_MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const DIAS_SEMANA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

    async function cargarTertulias() {
      try {
        const res = await fetch(GAS_URL_TERTULIAS + "?action=listar");
        const json = await res.json();

        const hoy = new Date(); hoy.setHours(0,0,0,0);
        const tertuliasFiltradas = json.filter(t => {
          const fechaT = new Date(t.fecha);
          fechaT.setHours(0,0,0,0);
          return fechaT.getTime() >= hoy.getTime();
        });

        const listado = document.getElementById("listadoTertulias");
        listado.innerHTML = "";
        tertuliasFiltradas.forEach(t => {
          const li = document.createElement("li");
          li.innerHTML = `${new Date(t.fecha).toLocaleDateString('es-ES', {weekday:'long', day:'2-digit', month:'short', year:'numeric'})} · <a href="${t.foto || '#'}" target="_blank">${t.tema}</a>`;
          listado.appendChild(li);
        });

        let tertuliasPorMes = {};
        tertuliasFiltradas.forEach(t=>{
          const f = new Date(t.fecha); f.setHours(0,0,0,0);
          const y = f.getFullYear();
          const m = f.getMonth();
          const clave = `${y}-${m}`;
          if(!tertuliasPorMes[clave]) tertuliasPorMes[clave] = [];
          tertuliasPorMes[clave].push({...t, dia: f.getDate()});
        });

        const calendariosDiv = document.getElementById('calendarios');
        calendariosDiv.innerHTML = '';
        Object.keys(tertuliasPorMes).sort().forEach(mesClave=>{
          const [anio, mes] = mesClave.split('-').map(Number);
          const eventos = tertuliasPorMes[mesClave];
          let eventosPorDia = {};
          eventos.forEach(ev=>{eventosPorDia[ev.dia] = ev;});

          const f = new Date(anio, mes, 1);
          const primeroWeekDay = (f.getDay() + 6)%7;
          const diasDelMes = new Date(anio, mes+1, 0).getDate();
          let tablaHtml = `<div class="month"><h2>${NOMBRES_MESES[mes]} ${anio}</h2><div style="overflow-x:auto;"><table><tr>`;
          DIAS_SEMANA.forEach(d=>tablaHtml+=`<th>${d}</th>`); tablaHtml+=`</tr><tr>`;
          let diaSemana = 0;
          for(; diaSemana<primeroWeekDay; diaSemana++) tablaHtml += `<td class="empty"></td>`;
          for(let dia=1; dia<=diasDelMes; dia++) {
            let contenido = `${dia}`;
            let classTd = "";
            if(eventosPorDia[dia]) {
              classTd = "tertulia";
              contenido = `<a href="${eventosPorDia[dia].foto || '#'}" target="_blank">${dia}<br>${eventosPorDia[dia].tema}</a>`;
            }
            tablaHtml += `<td class="${classTd}">${contenido}</td>`;
            diaSemana++;
            if(diaSemana===7 && dia<diasDelMes){ tablaHtml+="</tr><tr>"; diaSemana=0; }
          }
          for(; diaSemana && diaSemana<7; diaSemana++) tablaHtml+=`<td class="empty"></td>`;
          tablaHtml += `</tr></table></div></div>`;
          calendariosDiv.innerHTML += tablaHtml;
        });

      } catch (error) {
        console.error(error);
      }
    }
    window.onload = cargarTertulias;
  </script>
</body>
</html>
