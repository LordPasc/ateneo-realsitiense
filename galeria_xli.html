<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería fotográfica XLI Tertulia</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1em;
      background: #ecf0f1;
      color: #2c3e50;
      text-align: center;
    }
    h2 { margin-bottom: 1em; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .gallery img {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      padding: 20px;
      background: rgba(0,0,0,0.9);
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 6px;
    }
    .lightbox:target {
      display: flex;
    }
  </style>
</head>
<body>
  <h2>Galería fotográfica de la XLI Tertulia literaria · Libros al fresco</h2>
  <div class="gallery">
    <a href="#img1"><img src="42_1.jpg" alt="Foto 1"></a>
    <a href="#img2"><img src="42_2.jpg" alt="Foto 2"></a>
    <a href="#img3"><img src="42_3.jpg" alt="Foto 3"></a>
    <a href="#img4"><img src="42_4.jpg" alt="Foto 4"></a>
    <a href="#img5"><img src="42_5.jpg" alt="Foto 5"></a>
  </div>

  <!-- Lightboxes -->
  <div id="img1" class="lightbox"><a href="#"><img src="42_1.jpg" alt="Foto 1 ampliada"></a></div>
  <div id="img2" class="lightbox"><a href="#"><img src="42_2.jpg" alt="Foto 2 ampliada"></a></div>
  <div id="img3" class="lightbox"><a href="#"><img src="42_3.jpg" alt="Foto 3 ampliada"></a></div>
  <div id="img4" class="lightbox"><a href="#"><img src="42_4.jpg" alt="Foto 4 ampliada"></a></div>
  <div id="img5" class="lightbox"><a href="#"><img src="42_5.jpg" alt="Foto 5 ampliada"></a></div>
</body>
</html>
