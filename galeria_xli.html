<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería XLI Tertulia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #ecf0f1;
      color: #2c3e50;
    }
    header {
      background: #2c3e50;
      color: #fff;
      text-align: center;
      padding: 1em;
    }
    h1 { margin: 0; }
    main {
      padding: 2em;
      max-width: 1000px;
      margin: auto;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }
    .gallery img {
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .gallery img:hover { transform: scale(1.05); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      padding-top: 60px;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.9);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 80%;
      border-radius: 8px;
    }
    .close {
      position: absolute;
      top: 20px; right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover { color: #c0392b; }
  </style>
</head>
<body>

<header>
  <h1>Fotos de la XLI Tertulia literaria: "Libros al fresco"</h1>
</header>

<main>
  <p>Instantáneas del encuentro celebrado en julio de 2025.</p>
  <div class="gallery">
    <img src="42_1.jpg" alt="Foto 1" onclick="openModal(this.src)">
    <img src="42_2.jpg" alt="Foto 2" onclick="openModal(this.src)">
    <img src="42_3.jpg" alt="Foto 3" onclick="openModal(this.src)">
    <img src="42_4.jpg" alt="Foto 4" onclick="openModal(this.src)">
    <img src="42_5.jpg" alt="Foto 5" onclick="openModal(this.src)">
  </div>
</main>

<!-- Modal -->
<div id="myModal" class="modal" onclick="closeModal()">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
</div>

<script>
  function openModal(src) {
    document.getElementById("myModal").style.display = "block";
    document.getElementById("modalImage").src = src;
  }
  function closeModal() {
    document.getElementById("myModal").style.display = "none";
  }
</script>

</body>
</html>
