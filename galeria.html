<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería Fotográfica - Ateneo Realsitiense</title>
<style>
body { font-family: 'Segoe UI', sans-serif; margin:0; padding:1em; background:#f5f5f5; color:#333; }
h1 { text-align:center; color:#2c3e50; }
.mosaico { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
.mosaico img { width:100%; height:150px; object-fit:cover; cursor:pointer; border-radius:6px; transition:0.3s; }
.mosaico img:hover { transform: scale(1.05); }
.modal { display:none; position:fixed; z-index:10000; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center; }
.modal img { max-width:90%; max-height:90%; border-radius:10px; }
.modal span { position:absolute; top:20px; right:30px; font-size:2em; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<h1>Galería Fotográfica</h1>
<div class="mosaico" id="mosaicoFotos"></div>

<div class="modal" id="modalFoto">
  <span onclick="cerrarModal()">✕</span>
  <img id="fotoGrande" src="" alt="Foto"/>
</div>

<script>
const GAS_URL_TERTULIAS = "https://script.google.com/macros/s/AKfycbxnD-USYB1pR6G8lA85elINIKIDjRNXx7R2J3LQfijEfUgEQ8IX0D0Um6HOkK3rxZAb5g/exec";

async function cargarGaleria(){
  try {
    const res = await fetch(GAS_URL_TERTULIAS + "?action=galeria");
    const fotos = await res.json();
    const cont = document.getElementById("mosaicoFotos");
    cont.innerHTML = "";

    fotos.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = "Foto Ateneo";
      img.onclick = () => mostrarModal(url);
      cont.appendChild(img);
    });

  } catch(err){
    console.error("Error al cargar la galería:", err);
  }
}

function mostrarModal(url){
  const modal = document.getElementById("modalFoto");
  document.getElementById("fotoGrande").src = url;
  modal.style.display = "flex";
}

function cerrarModal(){
  document.getElementById("modalFoto").style.display = "none";
  document.getElementById("fotoGrande").src = "";
}

window.onload = cargarGaleria;
</script>

</body>
</html>
